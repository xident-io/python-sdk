[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xident"
# Single-sourced from src/xident/_config.py::SDK_VERSION -- see [tool.hatch.version].
# Do NOT add a literal `version = "..."` here; it would reintroduce a second
# declaration that can (and did) drift out of step with the runtime constant.
dynamic = ["version"]
description = "Official Python SDK for Xident age & identity verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Xident", email = "support@xident.io" },
]
keywords = ["xident", "age-verification", "identity", "kyc", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25",
]

[project.urls]
Homepage = "https://xident.io"
Documentation = "https://docs.xident.io"
Repository = "https://github.com/xident-io/python-sdk"
Changelog = "https://github.com/xident-io/python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.hatch.version]
# Build-time read of the one declaration. `hatchling` applies `pattern` to
# `path` and uses the named `version` group as the distribution version.
path = "src/xident/_config.py"
pattern = 'SDK_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/xident"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/xident"]
# Branch coverage, not just statements: an `if` whose false arm is never taken
# reads as 100% otherwise.
branch = true

[tool.coverage.report]
show_missing = true
# The whole package is measured. No `omit`, and no `exclude_lines` beyond
# coverage's built-in default -- if a line is hard to reach, the fix is a test
# that reaches it or a note in the review, not an exemption.
fail_under = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
