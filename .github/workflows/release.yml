name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # This is the only moment where the tag and the source tree are both
      # known, which is why the SDK_VERSION/tag comparison has to happen
      # here.
      #
      # github.ref_name is handed to us by GitHub, so it needs no git
      # history: the default shallow, tagless checkout above is enough. A
      # test that instead ran `git describe` would fail here and pass on a
      # laptop.
      #
      # The comparison itself lives in TestSDKVersionMatchesReleaseTag rather
      # than in this file, so the rule is Python code under review, not
      # shell.
      - name: SDK_VERSION must match the tag
        env:
          XIDENT_RELEASE_VERSION: ${{ github.ref_name }}
        run: python -m pytest tests/test_version.py -k TestSDKVersionMatchesReleaseTag -v

      - name: Full test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Build distribution
        run: |
          pip install build
          python -m build

  publish:
    name: Publish to PyPI
    needs: version-guard
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: PyPI verifies a short-lived OIDC token minted by
      # GitHub for this exact repo+workflow, so there is NO API token to store,
      # scope wrongly, or leak. Chosen over PYPI_API_TOKEN deliberately — the
      # npm side of this same release lost two runs to a mis-scoped token.
      #
      # One-time setup on pypi.org: Manage project -> Publishing -> add a
      # trusted publisher for xident-io/python-sdk, workflow release.yml.
      # Optionally bind it to a GitHub environment and add `environment: pypi`
      # here; omitted so there is one place to misconfigure instead of two.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rebuilt rather than carried from version-guard as an artifact: a fresh
      # checkout is one less way for what ships to differ from what was tested.
      - name: Build distribution
        run: |
          pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
