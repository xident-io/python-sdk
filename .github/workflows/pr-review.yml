# =============================================================================
# PR Review — Python SDK
#
# Runs on every pull request to main.
# Jobs: test, code-review, security-review, pr-summary
# =============================================================================

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      test-result: ${{ steps.test.outcome }}
      test-output: ${{ steps.test.outputs.output }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The package and its test tools must be installed, or pytest is not
      # even found. This job used to skip the install and append
      # `|| echo "No tests yet"`, so a missing pytest or a failing test both
      # reported success in the PR summary.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Keep the last 50 lines for the PR summary, then exit with pytest's own
      # status, so a failing test fails this job and the summary says failure.
      - name: Run tests
        id: test
        run: |
          set +e
          OUTPUT=$(python -m pytest tests/ 2>&1)
          STATUS=$?
          set -e
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" | tail -50 >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit $STATUS

  code-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Review this PR thoroughly. Focus on:
            1. Code quality, readability, and adherence to project conventions
            2. Potential bugs, edge cases, and error handling
            3. Performance implications
            4. Test coverage adequacy
            5. Documentation completeness

            Be specific with line references. Suggest improvements, not just problems.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    outputs:
      findings-count: ${{ steps.security.outputs.findings-count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Claude Security Review
        id: security
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: false
          upload-results: true
        env:
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [test, security-review]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The test output and results reach the script through the environment,
      # not pasted into its source: test output is text from the PR's own
      # code, and pasted into a JavaScript template literal a backtick or
      # `${...}` in it would run as script.
      - name: Generate PR Summary
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.outputs.test-result }}
          TEST_OUTPUT: ${{ needs.test.outputs.test-output }}
          SECURITY_FINDINGS: ${{ needs.security-review.outputs.findings-count }}
        with:
          script: |
            const testResult = process.env.TEST_RESULT || '';
            const testOutput = process.env.TEST_OUTPUT || '';
            const securityFindings = process.env.SECURITY_FINDINGS || '0';
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const filesSummary = files.map(f => 
              `- \`${f.filename}\` (+${f.additions}/-${f.deletions})`
            ).join('\n');
            
            const testEmoji = testResult === 'success' ? '✅' : testResult === 'failure' ? '❌' : '⚠️';
            const securityEmoji = parseInt(securityFindings) === 0 ? '✅' : '🔴';
            
            const body = `## 📋 PR Review Summary
            
            ### 🎯 Changes Overview
            **${files.length} files changed** | +${pr.additions} additions | -${pr.deletions} deletions
            
            <details>
            <summary>Files changed</summary>
            
            ${filesSummary}
            </details>
            
            ### ${testEmoji} Test Results
            **Status**: ${testResult || 'unknown'}
            
            <details>
            <summary>Test output</summary>
            
            \`\`\`
            ${testOutput || 'No test output captured'}
            \`\`\`
            </details>
            
            ### ${securityEmoji} Security Review
            **Findings**: ${securityFindings} issue(s) detected
            
            > Full security review details available in the workflow artifacts.
            
            ### 🤖 Code Review
            Claude Code Review runs as a separate job and posts inline comments directly on the PR.
            
            ---
            *Generated by PR Review workflow*`;
            
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.data.find(c => 
              c.body.includes('📋 PR Review Summary')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
